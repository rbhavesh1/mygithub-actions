name: 052-docker-ghcr-workflow

on:
  push:
    branches: none
    tags: none

  pull_request:
    branches: none

  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: rbhavesh1/github-actions-course
  IMAGE_TAG: 1.0.${{ github.run_number }}

jobs:

  build-push-docker:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:

      # ---------------------------------------------------------
      # Checkout source code
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # Install Cosign
      # ---------------------------------------------------------
      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v4.1.0


      # ---------------------------------------------------------
      # Setup Docker Buildx
      # ---------------------------------------------------------
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3


      # ---------------------------------------------------------
      # Login to GitHub Container Registry
      # ---------------------------------------------------------
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      # ---------------------------------------------------------
      # Generate Docker image metadata
      # ---------------------------------------------------------
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}


      # ---------------------------------------------------------
      # Build and push Docker image
      # ---------------------------------------------------------
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v6
        with:
          context: ./03-app-dotnet
          file: ./03-app-dotnet/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: ${{ steps.meta.outputs.labels }}


      # ---------------------------------------------------------
      # Sign Docker image using Cosign
      # ---------------------------------------------------------
      - name: Sign Docker image
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "true"
        run: |
          cosign sign \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}
